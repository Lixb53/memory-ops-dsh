name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，此处不再重复声明
      # （两处都写会触发 ERR_PNPM_BAD_PM_VERSION）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      # 静态审计：抓 tsc 与单测都看不见的渲染层缺陷
      # （return 逗号表达式丢 UI 块、hook 顺序错致白屏、frontmatter 往返毁数据）
      - name: 静态审计
        run: pnpm run static-audit

      - name: 单元测试
        run: pnpm test

      - name: 构建产物
        run: pnpm build

      - name: 校验构建产物可加载
        run: node -e "import('./packages/dsh-plugin/lib/index.js').then(m => { if (typeof m.apply !== 'function') throw new Error('host 半体缺少 apply'); console.log('host ok'); })"
