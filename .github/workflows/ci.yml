name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建产物
        run: pnpm build

      - name: 校验构建产物可加载
        run: node -e "import('./packages/dsh-plugin/lib/index.js').then(m => { if (typeof m.apply !== 'function') throw new Error('host 半体缺少 apply'); console.log('host ok'); })"
