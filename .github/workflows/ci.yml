name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，此处不再重复声明
      # （两处都写会触发 ERR_PNPM_BAD_PM_VERSION）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      # 静态审计：抓 tsc 与单测都看不见的渲染层缺陷
      # （return 逗号表达式丢 UI 块、hook 顺序错致白屏、frontmatter 往返毁数据）
      - name: 静态审计
        run: pnpm run static-audit

      - name: 单元测试
        run: pnpm test

      - name: 构建产物
        run: pnpm build

      - name: 校验构建产物可加载
        run: node -e "import('./packages/dsh-plugin/lib/index.js').then(m => { if (typeof m.apply !== 'function') throw new Error('host 半体缺少 apply'); console.log('host ok'); })"

      # lib/ 已入库（宿主经 git 安装时会直接读它，不会在仓库根跑构建），
      # 所以必须守住「入库的产物 == 当前源码构建出来的产物」这条不变式。
      # 少了这一步，改了 src 却忘了提交产物，推上去的插件就是旧的，
      # 而且 git 安装不会报错——只会静默跑旧代码。
      - name: 校验入库产物与源码一致
        run: |
          if [ -n "$(git status --porcelain packages/dsh-plugin/lib)" ]; then
            echo "::error::packages/dsh-plugin/lib 与源码不一致：改了 src 就要提交重新构建的产物。"
            git status --porcelain packages/dsh-plugin/lib
            git diff -- packages/dsh-plugin/lib | head -100
            exit 1
          fi
          echo "入库产物与源码构建结果一致"
